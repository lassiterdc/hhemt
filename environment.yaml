# to run:
# if environment already exists, first run:
# conda deactivate
# conda env remove -n hhemt
# then:
# either:
  # clean install, no use of :
    # conda create -n hhemt python=3.11 --no-default-packages
    # conda activate hhemt
    # export PYTHONNOUSERSITE=1
    # conda env update -f environment.yaml
  # create directly from environment yaml
    # module purge
    # module load {conda app, e.g., miniforge}
    # conda env create -f environment.yaml
    # conda (or source) activate hhemt
# IMPORTANT: after creating the environment, run BOTH post-create steps, in order:
  # pip install --no-deps "swmmio==0.8.2"
  # pip install -e . --no-deps
  # (both required — without them, imports of hhemt fail AND pyswmm is downgraded)
#
# WHY swmmio is installed here with --no-deps instead of in the `pip:` block below:
#   `--no-deps` prevents `pip install -U` from touching the conda graph at all. conda runs
#   the ENTIRE `pip:` block as ONE `pip install -U -r <tmpfile>`
#   (conda/env/installers/pip.py), so any spec in that block can displace conda-installed
#   packages during a single joint resolve.
#   The HISTORICAL risk was specific to swmmio 0.8.5, whose metadata declared
#   `pyswmm<2.0,>=1.2` and `numpy<2.0` and so downgraded the conda pyswmm 2.0.1 -> 1.5.1.
#   That risk is GONE at the pinned 0.8.2: it declares NO `pyswmm` requirement at all, and
#   its numpy/pandas entries are FLOORS (`numpy>=1.16.4`, `pandas>=0.24.2`), not caps.
#   `--no-deps` now guards only against PyPI wheels displacing conda's numpy/pandas.
#   Do NOT restore swmmio to the `pip:` block on the strength of that: the guard is still
#   load-bearing, and `scripts/check_env_lock_consistency.py` refuses it either way.
#   `pip install -e . --no-deps` for the same reason: pyproject.toml leaves pyswmm unpinned.
name: hhemt
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - filelock
  - typer
  - pydantic=2.7  # pyproject requires ==2.7.*; declared here because the conda env is
                  # the ONLY source of the runtime graph under `pip install -e . --no-deps`.
                  # Until 2026-08-26 this was held only by hsmodels' transitive pin.
  - pyyaml
  - zarr
  - netcdf4
  - scipy
  - pydap
  - h5netcdf
  - h5py  # h5netcdf's default backend; scenario._write_sim_weather_nc reads weather.nc via the xarray h5netcdf engine
  - cftime
  - bottleneck
  - dask
  - matplotlib
  - seaborn
  - jinja2>=3.1  # restates pyproject's constraint verbatim (see check_env_lock_consistency (f))
  - sparse
  - pint
  - bagit
  - openpyxl
  # geospatial packages
  - rioxarray
  - cartopy
  - geopandas
  - fiona
  - pyproj
  - shapely
  # swmmio runtime deps — declared explicitly because swmmio is installed with
  # --no-deps post-create (see header). `numpy<2` / `pandas<3` are VALIDATION pins, not
  # swmmio caps: swmmio 0.8.2 declares `numpy>=1.16.4` / `pandas>=0.24.2` with no upper
  # bound at all (the `<2.0` cap belonged to the retired 0.8.5). The project is validated
  # on numpy 1.26.4 / pandas 2.3.3, and conda-forge now ships numpy 2.4.6 / pandas 3.0.3
  # for py311 — without these pins a fresh solve silently jumps two major versions.
  # Do NOT delete them on the grounds that swmmio no longer caps numpy; it never did at
  # the version this project pins, and the validation reason is the load-bearing one.
  - "numpy<2"
  - "pandas<3"
  - geojson
  - pyshp
  - networkx
  # pyproject CORE deps that `pip install -e . --no-deps` does NOT install.
  # `--no-deps` (required — see header) means the conda env is the ONLY source of the
  # project's runtime graph, so environment.yaml MUST be a superset of pyproject.toml's
  # `[project].dependencies`. Enforced by scripts/check_env_lock_consistency.py; the sole
  # sanctioned exception is `swmmio`, installed post-create with --no-deps (see header).
  # Omitting any of these surfaces as an opaque ModuleNotFoundError at test-collection
  # time in a 90-minute CI job (this is exactly how `plotly` broke run 29175069823).
  - plotly=5.24.1
  - rich
  - requests>=2.25
  - globus-sdk>=3.0
  - datashader>=0.16
  # build tools
  - cmake
  - openmpi
  - gxx_linux-64
  # other stuff
  - coverage
  - pytest
  - pytest-xdist>=3.0
  - py-spy>=0.3.14
  - ruff=0.15.10
  - ty
  - pre-commit
  - ipdb
  - ipykernel
  - pip
  - "setuptools<78"  # hsclient uses pkg_resources, removed from setuptools>=78
  # SWMM Python engine from conda-forge, NOT the PyPI wheel: the PyPI
  # swmm-toolkit 0.17.0 wheel heap-corrupts in pyswmm Simulation.execute()
  # (free(): tcache 2 / SIGABRT) on modern glibc, and 0.17.0 also has an
  # Output.node_series "Input Error 422" reader regression. conda-forge
  # swmm-toolkit 0.15.x is clean on both; pyswmm=2.0.1 is the matching pin.
  #
  # The pin is EXACT, not a range: `_conda_name_version` in
  # scripts/check_env_lock_consistency.py partitions on the first `=`, so a spec like
  # `swmm-toolkit>=0.15.3,<0.16` parses its name as `swmm-toolkit>` and silently
  # disables assertion (b). It is also >=0.15.3 because pyproject requires that
  # (earliest release with a cp312 wheel) and assertion (f) enforces containment.
  #
  # INVARIANT (enforced by scripts/check_env_lock_consistency.py): NOTHING in the
  # `pip:` block below may name or depend on pyswmm / swmm-toolkit / swmmio. conda
  # runs the whole `pip:` block as a single `pip install -U -r`, and any pip spec
  # that constrains pyswmm will silently uninstall the conda one. swmmio is
  # therefore installed post-create with --no-deps (see header).
  - swmm-toolkit=0.15.5
  - pyswmm=2.0.1
  - pip:
      - hsclient
      # !=0.2.1.post1: the .post1 re-upload ships only an armv7l wheel; PEP 440
      # ranks it above 0.2.1 so the bare range picks it and pip fails on x86_64.
      - "kaleido>=0.2.1,!=0.2.1.post1,<1.0"
      - tabulate
      - notebook
      - jupyter_server
      - ipywidgets
      - snakemake==9.15.0
      - snakemake-executor-plugin-slurm==2.1.0
      - snakemake-executor-plugin-slurm-jobstep==0.4.0
      - snakemake-storage-plugin-fs==1.1.3
      # RO-Crate provenance core dependency (ADR-5/6/7); pinned for byte-determinism.
      - rocrate==0.15.0
