# Pre-commit hooks for TRITON-SWMM toolkit
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Ruff linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ---------------------------------------------------------------------------
  # INTERPRETER CONTRACT for every `local` hook in this file.
  #
  # A git hook inherits no shell state, and Debian/Ubuntu ship no unversioned
  # `python`, so `entry: python ...` aborts with `Executable python not found`
  # on a stock machine. Every local hook therefore runs through
  # `uv run --locked`, which:
  #   - resolves the project environment from the working directory and IGNORES
  #     any active conda/venv (it warns `VIRTUAL_ENV ... will be ignored` and
  #     proceeds), so the sanctioned `conda run -n agentic ... git_stage
  #     --commit` actuator reaches a working interpreter;
  #   - binds to the tree BEING COMMITTED. A conda-env pin does not: the hhemt
  #     env's `__editable__.hhemt-0.1.0.pth` names the MAIN clone, so from a
  #     worktree it grades that worktree's files against main's code;
  #   - creates and populates `.venv` from the committed `uv.lock` on a fresh
  #     clone, so a new contributor needs no environment step for hooks to work;
  #   - refuses legibly when `uv.lock` is stale (that is what `--locked` buys
  #     over `--frozen`, which runs the guards against an environment that does
  #     not match the declared dependencies and reports a bare ModuleNotFoundError).
  #
  # `uv` is a hard prerequisite for committing; see docs/contributing.md.
  #
  # DEPENDENCY UNION of the nine scripts below: hhemt, openpyxl, packaging,
  # pyyaml, Python >= 3.11 -- all supplied by the default (no-extra) sync.
  # `openpyxl` is a core dependency; `packaging` arrives TRANSITIVELY via core
  # `snakemake`. check_env_lock_consistency.py raises SystemExit without
  # `packaging`, so dropping snakemake from core deps would break that guard.
  # Two of the needs are DEFERRED imports and are invisible to a module-level
  # import grep: `yaml` inside check_caption_vocabulary.load_retired(), and
  # `openpyxl` inside check_retired_field_overlay_columns._overlay_columns().
  #
  # `default_language_version` is deliberately ABSENT: it governs managed-language
  # environments only and is inert for `language: system` (measured -- a system
  # hook ran on ambient 3.12.3 under `default_language_version: python:
  # python3.11`, while a managed hook in the same run honoured it). The
  # interpreter floor is `requires-python = ">= 3.11, < 3.13"` in pyproject.toml,
  # which uv honours when it selects an interpreter and `--locked` enforces at
  # every hook invocation.
  # ---------------------------------------------------------------------------

  # Version-migration discipline (scripts/check_layout_version.py)
  # Check A: LAYOUT_VERSION bump => migration module + fixtures
  # Check B: layout-relevant file change => bump or non_breaking_allowlist entry
  - repo: local
    hooks:
      - id: check-layout-version-a
        name: check LAYOUT_VERSION bump implies migration + fixtures
        entry: uv run --locked python scripts/check_layout_version.py check-a HEAD~1
        language: system
        pass_filenames: false
        always_run: true
      - id: check-layout-version-b
        name: check layout-relevant files trigger LAYOUT_VERSION bump
        entry: uv run --locked python scripts/check_layout_version.py check-b HEAD~1
        language: system
        pass_filenames: false
        always_run: true

      - id: check-caption-pairing
        name: check captioned renderer changes are paired with caption edits
        entry: uv run --locked python scripts/check_caption_pairing.py HEAD~1
        language: system
        pass_filenames: false
        always_run: true

      - id: check-caption-vocabulary
        name: retired-vocabulary guard over the report template tree
        entry: uv run --locked python scripts/check_caption_vocabulary.py
        language: system
        pass_filenames: false
        always_run: true

  # DU-sentinel mutation-site restamp discipline (scripts/check_du_sentinel_sites.py)
  # Flags fast_rmtree(...) missing analysis_dir= and .unlink() not adjacent-followed
  # by restamp_parent_sentinels(...), unless the site carries # EXEMPT-DU: {category}.
  - repo: local
    hooks:
      - id: check-du-sentinel-sites
        name: DU-sentinel mutation-site restamp check
        entry: uv run --locked python scripts/check_du_sentinel_sites.py
        language: system
        pass_filenames: false
        always_run: true

  # Anonymization guard (scripts/check_anonymization.py)
  # Fails if any tracked file contains a genuinely-private identifier listed in
  # scripts/anonymization_blocklist.txt (ADR-14).
  #
  # The pre-commit FRAMEWORK is installed (environment.yaml:106) — what is not yet run in
  # this clone is `pre-commit install`, so `.git/hooks/` is empty and no hook here fires.
  # That is a per-clone activation step, not a missing dependency.
  #
  # Registered at BOTH pre-commit and pre-push. Pre-push is the load-bearing venue: CI runs
  # this guard on `push` to main/develop, i.e. AFTER the objects are already on GitHub, so
  # CI can only detect a leak that is by then permanent. Pre-push is the last venue that can
  # PREVENT one. The empirical record shows the leak-then-clean cycle running at least twice
  # (2026-07-26 and 2026-08-27), each cycle leaving a leaked blob in history forever.
  - repo: local
    hooks:
      - id: anonymization-guard
        name: anonymization blocklist guard
        entry: uv run --locked python scripts/check_anonymization.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

  # Commit-MESSAGE anonymization guard (scripts/check_commit_message_anonymization.py)
  # check_anonymization.py scans tracked file CONTENTS and is blind to commit messages.
  # Three messages in this history carry blocklisted tokens, one of them a remediation
  # commit that re-leaked into its own subject line. A message is rewritable only before
  # the commit object exists, so commit-msg is the only venue that can prevent this.
  - repo: local
    hooks:
      - id: anonymization-guard-commit-msg
        name: anonymization blocklist guard (commit message)
        entry: uv run --locked python scripts/check_commit_message_anonymization.py
        language: system
        stages: [commit-msg]

  # Vocabulary freeze (scripts/check_vocabulary_freeze.py)
  # INVERTED assertion: requires the OLD vocabulary to still be PRESENT in the
  # forward-only migration modules, their legacy fixtures, and their tests. A
  # rename sweep that reaches the frozen set turns this red; nothing else does.
  # Without it, a renamed literal makes a historical migration find nothing,
  # take its early return, and report success.
  - repo: local
    hooks:
      - id: vocabulary-freeze
        name: migration vocabulary freeze
        entry: uv run --locked python scripts/check_vocabulary_freeze.py
        language: system
        pass_filenames: false
        always_run: true

  # Retired-field overlay-column discipline (scripts/check_retired_field_overlay_columns.py)
  # Flags any sensitivity-xlsx overlay column system.{field} / analysis.{field}
  # whose {field} is absent from the live system_config / analysis_config model_fields.
  - repo: local
    hooks:
      - id: check-retired-field-overlay-columns
        name: check retired-field overlay columns
      # This is the ONLY hook here that imports `hhemt`, so the interpreter
      # contract above is load-bearing rather than uniform-for-tidiness: it must
      # grade THIS tree's fixtures against THIS tree's model_fields. Measured
      # 2026-09-03 mid-merge, with src/hhemt/utils.py carrying conflict markers:
      # `uv run --locked` surfaced the broken tree, while `conda run -n hhemt`
      # imported main's hhemt and reported success on it.
        entry: uv run --locked python scripts/check_retired_field_overlay_columns.py
        language: system
        pass_filenames: false
        always_run: true

  # environment-lock.yaml swmm-provenance drift guard (scripts/check_env_lock_consistency.py)
  # Fails if the lock re-introduces the pyswmm/swmm-toolkit teardown heap-corruption:
  # any pip-block swmm-toolkit/pyswmm, or a conda pin drifted off environment.yaml's
  # 0.15.x swmm-toolkit / pyswmm 2.x. Authoring-time tripwire; CI (compile-tests.yml)
  # is the enforcement layer. Scoped to the env files so it fires only when they change.
  - repo: local
    hooks:
      - id: check-env-lock-consistency
        name: environment-lock.yaml swmm-provenance consistency
        entry: uv run --locked python scripts/check_env_lock_consistency.py
        language: system
        pass_filenames: false
        files: ^environment(-lock)?\.yaml$
