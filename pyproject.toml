[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hhemt"
version = "0.1.0"
description = "Tools for running and processing TRITON-SWMM models."
readme = "README.md"
authors = [
  {name = "Daniel Lassiter", email = "daniel.lassiter@outlook.com"}
]
maintainers = [
  {name = "Daniel Lassiter", email = "daniel.lassiter@outlook.com"}
]
# NOTE: do NOT add a `License :: ...` trove classifier. With PEP 639
# `license = "PolyForm-Noncommercial-1.0.0"` + setuptools>=77, a legacy License
# classifier raises setuptools InvalidConfigError at build time (verified). Every
# string below is a valid live PyPI classifier — PyPI rejects unknown ones at
# upload, which would fail the publish AFTER the irreversible tag push.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: GIS",
]

license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]

dependencies = [
    "filelock",
    "pydantic==2.7.*",
    "pyyaml",
    "zarr",
    "netcdf4",
    "h5netcdf",
    "h5py",  # h5netcdf's default backend; scenario._write_sim_weather_nc reads weather.nc via the xarray h5netcdf engine
    "scipy",
    "dask",
    "matplotlib",
    "seaborn",
    "sparse",
    "pint",
    "bagit",
    "openpyxl",
    "rioxarray",
    "geopandas",
    "pyproj",
    "shapely",
    "hsclient",
    "requests>=2.25",
    # SWMM Python stack — deliberately under-constrained for the immutable v0.1.0 wheel.
    # The VALIDATED engine is NOT conda-exclusive: the Option C pin below resolves a
    # stack _assert_validated_swmm_stack ACCEPTS from PyPI alone. What conda-forge
    # supplies that pip cannot is the --no-deps swmmio install: swmmio 0.8.5 caps
    # pyswmm<2.0 — UNSATISFIABLE with the pyswmm 2.x prepare_scenario requires — and
    # the conda env installs swmmio with `--no-deps`, which pip metadata has no way to
    # express -- which is why the swmmio pin below is explicit rather than resolved.
    # A fresh `pip install hhemt` resolves a stack the fail-closed guard in
    # swmm_runoff_modeling.py ACCEPTS: the Option C pin caps swmm-toolkit below the
    # abi3 lineage. Conda remains the recommended path for the HPC pins
    # (docs/how-to/installation.md Option A). Non-SWMM use (reporting, consolidation,
    # publishing, .inp parsing) works regardless. See
    # library/knowledge/environment-management/pip metadata cannot reproduce a --no-deps conda environment.md.
    "pyswmm>=2,<3",              # prepare_scenario requires pyswmm 2.x; <3 guards a future API break
    "swmm-toolkit>=0.15.3,<0.16",  # Option C (q8c): pre-abi3 PyPI wheel, same engine (swmm_get_version 52004), PASSES _assert_validated_swmm_stack startswith("0.15.") with no conda/no override. abi3 lands at 0.16.1 -> 0.16.2/0.17.0 are the flagged free()/SIGABRT teardown lineage; 0.15.3 is earliest with a cp312 wheel. The validated engine is NOT conda-exclusive.
    "swmmio<0.8.3",             # .inp read/write via swmmio.Model; 0.8.2 is the last release without the pyswmm<2.0 cap — pinned explicitly so a permanent wheel does not rely on resolver-luck
    "tabulate",
    "notebook",
    "jupyter_server",
    "ipywidgets",
    "globus-sdk>=3.0",
    "plotly==5.24.1",
    # !=0.2.1.post1 excludes the ARM-only (manylinux2014_armv7l) re-upload of
    # kaleido; PEP 440 ranks .post1 above 0.2.1, so the bare range greedily picks
    # it and a fresh x86_64 install fails (no x86_64 wheel, no sdist). Plain 0.2.1
    # carries the manylinux1_x86_64 wheel used on all real targets.
    "kaleido>=0.2.1,!=0.2.1.post1,<1.0",
    "datashader>=0.16",
    "jinja2>=3.1",
    # CLI framework — cli.py / version_migration/__main__.py import these, and
    # the `hhemt` console-script entry-point requires them at runtime.
    "typer",
    "rich",
    # Snakemake is a CORE runtime dependency: every Analysis.run() / submit_workflow()
    # performs a `snakemake` dry-run on the default (local) submission path, so a
    # `pip install hhemt` with no extras must be able to orchestrate a local workflow.
    # The SLURM executor/storage plugins stay in the `hpc` extra (HPC-only).
    "snakemake==9.15.0",
    # ro-crate-py is a CORE runtime dependency: consolidation embeds a
    # deterministic RO-Crate provenance core into every analysis DataTree and
    # writes a co-located ro-crate-metadata.json sidecar (ADR-5/6/7). Pinned for
    # byte-deterministic serialization; its footprint does not touch the pydantic pin.
    "rocrate==0.15.0",
    # Ten module-level imports that were declared nowhere until D142 (see environment.yaml).
    "xarray>=2024.10",
    "pandas",
    "numpy",
    "packaging",
    "rasterio",
    "psutil",
    "nbformat",
    "affine",
    "platformdirs",
    "pydantic-core",
]
requires-python = ">= 3.11, < 3.13"

[project.optional-dependencies]
test = [
    "ruff==0.15.17",
    "ty",
    "pytest",
    "pytest-xdist>=3.0",
    "coverage",
]
# viz-export retained as an empty alias for one deprecation cycle so the
# documented `pip install -e '.[viz-export]'` keeps resolving after kaleido
# moved to core deps (sub-meter-flood-visibility Phase 1). Remove next cycle.
viz-export = []
# HPC orchestration extras required by SnakemakeWorkflowBuilder when
# multi_sim_run_method='batch_job' or '1_job_many_srun_tasks'. The
# SnakemakeWorkflowBuilder._validate_batch_job_dry_run unconditionally invokes
# `snakemake --executor slurm`, which requires the slurm executor plugin even
# for dry runs. `snakemake` itself is now a CORE dependency (see above); these
# are the SLURM-only executor/storage plugins. The jobstep plugin is required
# for the SLURM-job-step model the toolkit uses for per-rule resource control.
hpc = [
    "snakemake-executor-plugin-slurm>=2.0,<3",
    "snakemake-executor-plugin-slurm-jobstep>=0.3,<1",
    "snakemake-storage-plugin-fs==1.1.3",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    # DIRECT, not transitive: `scripts/check_docs_content.py` imports `griffe`
    # to derive the rendered-docstring population the way the renderer does.
    # `mkdocstrings-python` already requires it, but a gate that imports a
    # package must declare it. Pin the DISTRIBUTION name: measured in this
    # environment, `importlib.metadata.version("griffelib")` is 2.1.0 while
    # `version("griffe")` raises PackageNotFoundError, so `griffe` is the
    # import name and is not what provides this package here.
    "griffelib>=2,<3",
    "mkdocs-htmlproofer-plugin",
]

[project.urls]
bugs = "https://github.com/lassiterdc/hhemt/issues"
changelog = "https://github.com/lassiterdc/hhemt/blob/main/HISTORY.md"
homepage = "https://github.com/lassiterdc/hhemt"

[project.scripts]
hhemt = "hhemt.cli:app"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI params as `name: type = typer.Option(...)` / `typer.Argument(...)`,
# i.e. a function call in the parameter default — the idiomatic Typer API. B008
# (function-call-in-default) is a false positive for this pattern; suppressing it
# here is the standard resolution (the alternative is migrating every CLI parameter
# to `Annotated[type, typer.Option(...)]`).
"src/hhemt/cli.py" = ["B008"]
"src/hhemt/version_migration/__main__.py" = ["B008"]

# rollin_status.py's SPECS is a hand-aligned (spec, cluster, target, marker) table.
# The column alignment IS the readability of that artifact, so wrapping to 120 would
# destroy the thing the file exists to present. E501 is suppressed for that reason,
# not because long lines are acceptable generally.
"scripts/rollin_status.py" = ["E501"]

# Notebooks under examples/ are prose-and-output artifacts, not linted source;
# their long lines are markdown/output rather than code.
"examples/*.ipynb" = ["E501"]

[tool.uv]
package = true

[tool.ty.environment]
  # Two tiers, per ### D144. UNSET -> .venv, the REPORTING stack (numpy 2.x / pandas 3.x),
  # which may not fail a build. Set HHEMT_TY_ENV to the certified conda prefix to GATE
  # on the stack environment.yaml describes (python 3.11 / numpy 1.26.4 / pandas 2.3.3).
  # Measured: ty expands ${VAR} and ${VAR:-default} here, and errors out when a bare
  # ${VAR} is unset rather than falling back silently.
  #
  # The named variable is NOT the ambient $VIRTUAL_ENV: this line's purpose is to stop a
  # stale VIRTUAL_ENV inherited from a shell activated in another tree from choosing the
  # target, which is the defect ### D143 was issued against.
  #
  # Do NOT "fix" swmm_runoff_modeling.py's np.trapz probe. Under the RULED conda target
  # it produces no diagnostic at all (grep -c trapz over the full set returns 0); it is
  # reported only under the pip tier, where it is a false positive and the repair would
  # break the numpy 1.x support ### D144 confirms is still current.
python = "${HHEMT_TY_ENV:-.venv}"

[tool.ty.src]
  # The in-force canaries are deliberately dirty and must NOT redden the main gate.
  # This filters DISCOVERY only: `ty check tools/ty_canary` still reaches them, which is
  # how scripts/check_ty_overrides_in_force.py works -- verified, because the opposite
  # behaviour was equally plausible. NEVER pass --force-exclude to that check: it turns
  # this into a hard block and the check then prints "All checks passed!" at exit 0,
  # which IS the fail-open signature it exists to detect.
exclude = ["tools/ty_canary"]

[[tool.ty.overrides]]
  # HAND-WRITTEN AND PERMANENT -- deliberately above the generated region, so neither a
  # regeneration nor a generator scope decision can remove it. Pairs with
  # tools/ty_canary/canary_armed.py, which the generator EXCLUDES (see CANARY_DIR).
  # Delete this block and the in-force check reports 2 diagnostics and fails loudly --
  # verified by injection.
include = ["tools/ty_canary/canary_covered.py"]

[tool.ty.overrides.rules]
invalid-assignment = "ignore"

[tool.setuptools.package-data]
hhemt = [
    "examples/*.yaml",
    "examples/*.md",
    "examples/*.xlsx",
    "examples/*.csv",
    "report_templates/**/*",
    "sif/recipes/*.def",
    "invalidating_fixes.yaml"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["test_data", "docs", ".git", ".venv", "venv", "dev"]
# census-green-up Phase 1 — systematic tmp hygiene. Default "all" keeps every
# test's tmp_path for the whole run (and the last 3 base dirs across runs); with
# large per-test fixture artifacts that accumulates to tens of GB within one run
# and can exhaust the disk. "failed" reclaims each passing test's tmp_path
# immediately while retaining failed-test tmp dirs for debugging.
tmp_path_retention_policy = "failed"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "globus_e2e: end-to-end Globus transfer tests; require activated endpoints and HHEMT_GLOBUS_E2E=1",
    "publish_e2e: end-to-end publish (HydroShare/Zenodo) tests; require credentials and HHEMT_PUBLISH_E2E=1",
    "requires_snakemake_subprocess: deselected by Gate A. Measured NOT to spawn in 36 of the 107 tests this marker removes from Gate A; population under re-derivation. Rationale: incompatible with pytest-xdist nested parallelism, never wired.",
    "compile_tier: DERIVED at collection from the fixture closure (tests/conftest.py) for any test holding `tritonswmm_cpu_compiled`; hand-applied ONLY where a body compiles directly. Deselected by Gate A, required by Gate B.",
]
# Dump every thread's traceback after this many seconds in ONE test, to the stderr fd
# stashed at configure time (so it bypasses pytest's own capture). It does NOT kill:
# faulthandler_exit_on_timeout stays at its default False, because the gated tier has
# legitimate multi-minute simulations. One dump per exceeding test, not a repeat.
# DEPENDENCY: this writes to stderr, which `conda run` CAPTURES. Under a detached Gate B
# the dumps are buffered and lost on a kill unless the recipe passes --no-capture-output
# (justfile). The setting and that flag are one instrument, not two.
faulthandler_timeout = 300
filterwarnings = [
    "ignore:Support for class-based `config` is deprecated:DeprecationWarning",
    "ignore::DeprecationWarning:pkg_resources",
]

# === GENERATED ty overrides -- do not hand-edit; see scripts/generate_ty_overrides.py ===
# NOTHING may be added below the END marker, for two distinct reasons.
# (1) Regeneration rebuilds this file as everything-above-MARKER plus a fresh
#     table, so an appended [tool.x] block is SILENTLY DESTROYED.
# (2) A bare key appended at end-of-file has no enclosing table header, so
#     TOML puts it inside the LAST [tool.ty.overrides.rules] table and it
#     becomes a type-checker suppression. That happens at PARSE time, before
#     any regeneration. No sentinel prevents it: a comment does not close a
#     TOML table. Put new configuration ABOVE the MARKER line.

[[tool.ty.overrides]]
include = ["conftest.py"]

