# The CLOSED exemption table of the anonymization guard's generic pattern layer
# (scripts/check_anonymization.py, layer (a)). It is PUBLIC, so it names a path glob, a class and a reason and never a
# value. NO producer-specific value is ever an entry here: a producer-specific token belongs in
# the private carrier reached through $HHEMT_ANONYMIZATION_BLOCKLIST or the
# `hhemt.blocklistPath` git-config key, never in this file.
#
# The table was sized by a census of the tracked set and is TOTAL over it: the guard
# run over the whole tree with no carrier exits 0. The toolkit's own published author address
# is exempt by VALUE and is read from pyproject.toml at run time, so it has no row here.
#
# Every row names exactly one file: there is no wildcard, so a newly published page needs its
# own row and a reviewer sees it.
#
# A hit in a file this table does not cover is a finding to fix at its source (build the
# value at run time from fragments), not a new row. Do not add a test file here.
#
# FORMAT. The guard is stdlib-only and parses a restricted subset of YAML: an `exemptions:`
# header, then entries made of `- glob:`, `class:` and `reason:`, every value double-quoted on
# one line. Any other line makes the guard refuse. class is `email` or `path`.
exemptions:
  - glob: "docs/reference/bundles/norfolk-compute-config-sweep-report.html"
    class: "email"
    reason: "third-party vendored JavaScript licence headers inside two published bundle report pages; the pages are about 100 MB each, so the class is exempted before it is scanned"
  - glob: "docs/reference/bundles/norfolk-observed-events-report.html"
    class: "email"
    reason: "third-party vendored JavaScript licence headers inside two published bundle report pages; the pages are about 100 MB each, so the class is exempted before it is scanned"
  - glob: "docs/reference/bundles/norfolk-compute-config-sweep-report.html"
    class: "path"
    reason: "two published bundle report pages: one fixed generic word in the user-segment position that matches no token of the producer-specific list, and site filesystem mount names with no user segment"
  - glob: "docs/reference/bundles/norfolk-observed-events-report.html"
    class: "path"
    reason: "published bundle report page: the generic word in every user-segment position, written by scripts/prepare_example_report.py scrub and held there by tests/docs/test_example_report_publishable.py, and site filesystem mount names with no user segment"
  - glob: "tests/test_check_docs_content_tracked_absent_page.py"
