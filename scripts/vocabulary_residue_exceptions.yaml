 # Declared exceptions for scripts/check_vocabulary_residue.py.
 # Ships EMPTY on purpose: on a POST-rename tree every hit is undeclared until
 # a maintainer justifies it here. Each entry:
 #   - path: {path substring}
 #     token: {retired token, or "*" for any}
 #     reason: {why this site legitimately keeps the retired vocabulary}

  # FILENAME renames landed in this commit. No content-scanning instrument reaches a
  # file NAME, so the post-condition for this class is a tracked-file listing swept for
  # the retired vocabulary, which must return only paths under
  # tests/fixtures/legacy_layouts/ -- those are frozen historical records.
  #   src/hhemt/delete_subanalysis_runner.py           -> delete_member_runner.py
  #   src/hhemt/delete_subanalysis_reprocess_runner.py -> delete_member_reprocess_runner.py
  #   tests/test_cleanup_orphan_subanalyses.py         -> test_cleanup_orphan_members.py
  #   tests/test_subanalysis_yaml_materialization_gate.py -> test_member_yaml_materialization_gate.py
  #   tests/fixtures/perf_resume_ledger/{clean,resume}_triton/
  #       walltime_model_triton_sa_serial_6_r1_evt0.jsonl
  #       -> walltime_model_triton_member_serial_6_r1_evt0.jsonl
  # The four bundle-fixture directories per_sim/sa-{0,1,2,3}/ become member-{0,1,2,3}/.
  #
  # NON-PYTHON post-condition. check_vocabulary_residue.py globs "*.py" only, so a
  # plain-text sweep over *.yaml, *.yml, *.md, *.csv, *.j2, *.rst, *.toml, *.golden and
  # *.Snakefile is the completeness check for every other surface, and must return zero
  # outside the frozen legacy_layouts tree.
exceptions:
  - path: environment-lock.yaml
    token: "sa-"
    reason: >-
      `alsa-lib` is the Linux sound library; the `sa-` substring is coincidental, and this
      is a solver-produced lock file that must not be hand-edited.
  - path: test_data/norfolk_coastal_flooding/hpc_system_config_frontier.yaml
    token: "sa-"
    reason: >-
      `libhsa-runtime64` is the ROCm HSA runtime named in an LD_LIBRARY_PATH comment; the
      `sa-` substring is coincidental.
  - path: src/hhemt/workflow.py
    token: "sa-"
    reason: >-
      _SNAKEFILE_RETIRED_VOCAB_RE and its comment block are the guard that DETECTS a stale
      Snakefile; the retired literals ARE the check. Expected residue is 1 DIRECT plus 1
      INDIRECT. NARROW: this exempts every `sa-` in the largest file in the tranche, so run
      the whole-file post-condition BEFORE adding this entry and confirm the only residue
      is the guard.
  - path: src/hhemt/sensitivity_analysis.py
    token: "sa-"
    reason: >-
      _RETIRED_ID_COLUMNS holds the retired spreadsheet header spellings so the reader can
      tell an operator holding a pre-rename experiments spreadsheet which column to change.
      Same narrowness caveat as workflow.py.
  - path: scripts/check_vocabulary_freeze.py
    token: subanalys
    reason: >-
      The module's own docstring illustrates the inverted-assertion mechanism with a
      literal `(target_dir / "subanalyses").is_dir()` snippet describing what a frozen
      historical migration reads. Sweeping it would make the checker's own explanation of
      itself describe a directory name the checker no longer protects, and the residue gate
      would otherwise flag this prose as undeclared residue -- a self-inflicted false
      positive on the guard's own docstring.
  - path: src/hhemt/version_migration/context.py
    token: "*"
    reason: >-
      WIDENED, never substituted. `_iter_member_dirs` is shared across EVERY migration, so
      it must enumerate a legacy tree (`subanalyses/sa_*`) and a current one
      (`members/member_*`) alike -- the pair is a two-element tuple read in one loop, and
      the retired half is the legacy arm. Substituting it does not fail loudly; it makes
      the helper return [] on every pre-rename tree, so a migration silently finds no
      members to migrate. Same class as V0019 reading the OLD value in order to rewrite it.
      vocabulary_freeze.yaml deliberately declines to freeze this file (freezing asserts a
      token must REMAIN, which is the wrong assertion for a file that must carry BOTH
      vocabularies), so this entry is the only surface that records the intent.
  - path: src/hhemt/version_migration/state.py
    token: "*"
    reason: >-
      Same legacy-plus-current container pair as version_migration/context.py, for the same
      reason and with the same silent-failure mode. Declared separately rather than by a
      `version_migration/` path prefix so that a future module under that package does not
      inherit an exemption nobody granted it.
  - path: scripts/check_rename_scope_collisions.py
    token: "sa_id"
    reason: >-
      the retired literals ARE the check; sweeping them inverts the instrument.
  - path: scripts/check_vocabulary_residue.py
    token: "sa-"
    reason: >-
      the retired literals ARE the check; sweeping them inverts the instrument.
  - path: src/hhemt/analysis.py
    token: "sa_id"
    reason: >-
      the `sa_id` identity column is a STANDING deferral -- it is the df_status /
      scenario_status.csv column AND the `override_force_rerun` API key (config/analysis.py:148
      raises "key must be 'sa_id' or 'event_iloc'"; analysis.py:4496/4510/4549 test it). It
