name: docs-build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project with docs extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build docs (strict — includes htmlproofer internal-link-check)
        run: mkdocs build --strict
      # Two independent assertions: every public symbol renders an anchor, AND
      # every public symbol carries a docstring. The second was added after 25
      # symbols — including the central `TRITONSWMM_analysis` class — were found
      # rendering as bare names while this step was green, because an anchor
      # proves the symbol reached the page and nothing more.
      - name: Assert public-API autodoc coverage
        run: python scripts/check_autodoc_coverage.py --site-dir site

      # Placeholder leakage and bare `path:line` citations. Needs no built SITE,
      # so it cannot false-red on a rendering issue -- but it does need the docs
      # extra, because it derives its population from `griffe` rather than from a
      # model of what the renderer does. That is a deliberate trade: the model it
      # replaced was wrong in three ways at once and each was silent. This step
      # must therefore stay AFTER the install step, and it is no longer runnable
      # against a bare checkout.
      - name: Assert docs content hygiene
        run: python scripts/check_docs_content.py
