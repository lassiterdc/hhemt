name: docs-build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project with docs extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      # The four gates (strict build with the htmlproofer internal-link check,
      # public-API autodoc coverage, docs content hygiene, published-surface
      # fidelity) live ONCE, in scripts/docs_gates.sh, each beside the rationale
      # for it. `just docs-check` runs the same script locally through
      # `uv run --locked --extra docs`; here RUN is empty, so every gate runs on
      # the interpreter the install step above populated. The script announces
      # each gate on stdout, which is where the per-step attribution now lives.
      - name: Run the documentation gates
        run: bash scripts/docs_gates.sh
