# Documentation reminder
#
# Posts a checklist on PRs that touch core modules, naming the PUBLIC
# documentation surfaces most likely to need an update alongside them.
#
# This is a REMINDER, not a check. It asserts nothing about whether the docs are
# actually stale and it never fails the build. That is deliberate and is stated
# here so the job's green is not read as a freshness verdict: the prior version
# of this workflow ran `python scripts/check_doc_freshness.py || true` against a
# script that does not exist in this repository, absorbed the resulting exit 127,
# set `check_complete=true` unconditionally, and posted its comment regardless —
# a green that certified nothing while looking like a passing check.

name: Documentation Reminder

on:
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'src/hhemt/config/**'
      - 'src/hhemt/workflow.py'
      - 'src/hhemt/execution.py'
      - 'src/hhemt/resource_management.py'
      - 'src/hhemt/sensitivity_analysis.py'
      - 'src/hhemt/swmm_*.py'
      - 'src/hhemt/log.py'
      - 'src/hhemt/system.py'
      - 'src/hhemt/analysis.py'
      - 'src/hhemt/scenario.py'
      - 'tests/conftest.py'
      - 'tests/utils_for_testing.py'
      - 'pyproject.toml'

permissions:
  contents: read
  pull-requests: write

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        # Paths are named as plain code spans rather than blob links. A blob URL
        # built from `context.ref` is wrong on a `pull_request` event, where the
        # ref is `refs/pull/N/merge` — not a branch a blob URL can address.
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: [
              '📝 **Documentation reminder**',
              '',
              'This PR touches core modules. Please check whether the public documentation needs updating alongside it:',
              '',
              '- [ ] `docs/reference/config-schema.md` — if a config field was added, renamed, or had its requiredness change',
              '- [ ] `docs/reference/api.md` — if a MODULE was added or removed. Symbols within a listed module render automatically; the docs-build job fails on any that carries no docstring.',
              '- [ ] `docs/how-to/` — if the steps for an existing task changed',
              '- [ ] `docs/explanation/capabilities.md` — if what the toolkit can or cannot do changed',
              '- [ ] Docstrings on any new or changed public symbol — these ARE the API reference',
              '',
              'This is a reminder only. It runs no freshness check and never fails the build.'
            ].join('\n')
          })
