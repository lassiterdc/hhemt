# Anonymization guard: fails if any tracked file contains a blocklisted
# genuinely-private identifier (scripts/anonymization_blocklist.txt).
# ADR-14 of public-release-reproducibility. Working-tree scrub enforcement;
# git HISTORY exposure is a separate concern (git-specialist / ADR-3).
# This workflow DELIVERS the check; designating it a required status check on
# `main` branch protection is the release-gate-and-branch-protection plan (ADR-7).
name: Anonymization guard

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# NOTE: once the blocklist carrier leaves this repo, add to the job:
#   if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
# Secrets are not passed to a workflow triggered from a fork (GitHub docs,
# data/reusables/actions/forked-secrets.md), so on a fork PR the guard cannot obtain
# ground truth. With a fail-closed loader it would fail; without one, it would pass
# having checked nothing. Not running is the only honest third state -- and a fork PR's
# commits live in the fork, not here, so nothing has entered this history until the push
# trigger fires, where the guard still works with real ground truth.

permissions:
  contents: read

jobs:
  anonymization-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run anonymization guard
        run: python scripts/check_anonymization.py
