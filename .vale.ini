# Vale configuration for the hhemt documentation pages. Run from the repository root with
# `python scripts/check_vale.py`, which fails on any alert.
StylesPath = .vale/styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = HhemtDocs, HhemtQuality, HhemtMarkers
HhemtDocs.BanLinuxOnce = NO

[docs/contributing.md]
BasedOnStyles = HhemtDocs, HhemtQuality, HhemtMarkers, HhemtContributing
HhemtDocs.BanLinuxOnce = NO

# The Home page and the installation guide may name Linux once.
[docs/index.md]
BasedOnStyles = HhemtDocs, HhemtQuality, HhemtMarkers
HhemtDocs.BanLinux = NO
HhemtDocs.BanLinuxOnce = YES

[docs/how-to/installation.md]
BasedOnStyles = HhemtDocs, HhemtQuality, HhemtMarkers
HhemtDocs.BanLinux = NO
HhemtDocs.BanLinuxOnce = YES

# The abbreviations snippet is a list of `*[ABBR]: expansion` definitions in the syntax of the
# abbreviations extension. The colon and the proper name Linux inside the expansions are syntax and
# names, not prose, so the whole file is exempt from those two rules.
[docs/_snippets/abbreviations.md]
BasedOnStyles = HhemtDocs, HhemtQuality, HhemtMarkers
HhemtDocs.BanLinuxOnce = NO
HhemtDocs.BanLinux = NO
HhemtDocs.Colon = NO

# The platform snippet is the one source that the Home page and the installation guide both include,
# so it states the Linux requirement once for both.
[docs/_snippets/platform-support.md]
BasedOnStyles = HhemtDocs, HhemtQuality, HhemtMarkers
HhemtDocs.BanLinuxOnce = NO
HhemtDocs.BanLinux = NO

[docs/reference/glossary.md]
BasedOnStyles = HhemtDocs, HhemtQuality, HhemtMarkers
HhemtDocs.BanLinuxOnce = NO
HhemtQuality.HeadingCase = NO
