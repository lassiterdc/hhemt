analysis_id: 'single_sim' # analysis folder name; will be created if it doesn't exist
hhemt_sha: REPLACE-WITH-THE-FULL-40-HEX-HHEMT-COMMIT  # REQUIRED ([Q331]); every process refuses unless the running toolkit IS this commit
weather_event_indices: ['year', 'event_type', 'event_id']
weather_time_series_storm_tide_datavar: 'waterlevel_m'
weather_time_series_timestep_dimension_name: 'timestep'
weather_time_series_spatial_mean_rainfall_datavar: 'mm_per_hr'  # Step-0 TBD: confirm via Rivanna weather NetCDF schema dump
weather_timeseries: '${DATA_DIR}/external/obs_event_tseries_from_yrs_with_complete_coverage.nc'
# weather_event_summary_csv: '${DATA_DIR}/external/observed_event_events.csv'
storm_tide_boundary_line_gis: '${DATA_DIR}/external/variable_bc.shp'
weather_events_to_simulate: '${DATA_DIR}/external/PLACEHOLDER.csv'
weather_event_windows_csv: '${DATA_DIR}/external/event_windows_observed.csv'  # per-event windows on the weather file's own time axis; without it preflight rejects 70 of 71 observed events for incomplete forcing
weather_event_start_column: 'event_start'
weather_event_end_column: 'event_end'
analysis_description:
run_mode: "serial"
multi_sim_run_method: "local"
local_cpu_cores_for_workflow: 4
# UNITS
rainfall_units: 'mm/hr'
storm_tide_units: 'm'
# TOGGLES
toggle_sensitivity_analysis: False
toggle_storm_tide_boundary: True
# PARAMETERS
target_processed_output_type: 'zarr' # zarr or nc
TRITON_raw_output_type: 'bin' # bin or asc
manhole_diameter: 1.2
manhole_loss_coefficient: 0.1
hydraulic_timestep_s: 0.01
TRITON_reporting_timestep_s: 120
open_boundaries: 1
report: {}
clear_raw: none
force_rerun: none
