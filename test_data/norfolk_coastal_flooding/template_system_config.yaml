# FILEPATHS
crs:  # canonical home for horizontal+vertical CRS resolution
  horizontal_epsg: 32147  # NAD83 / Virginia South (meter) — Norfolk coastal area
  vertical_epsg: 5703     # NAVD88 height (m)
watershed_gis_polygon: '${DATA_DIR}/external/norfolk_wshed_epsg32147_state_plane_m.shp'
system_directory: '${PACKAGE_DIR}/system'
DEM_fullres: '${DATA_DIR}/external/fullres_dem_m.tif'
landuse_lookup_file: '${DATA_DIR}/external/landuse_lookup_tables.csv'
landuse_raster: '${DATA_DIR}/external/landuse_clipped_to_triton_extent.tif'
TRITONSWMM_software_directory: '${PACKAGE_DIR}/triton'
SWMM_software_directory: '${PACKAGE_DIR}/swmm'
TRITONSWMM_git_URL: 'https://code.ornl.gov/hydro/triton.git'
TRITONSWMM_branch_key: 'faba223212408f04b7a3dbf6580adedf4a4e6b13'  # the head of the triton-swmm branch at ORNL (git ls-remote, 2026-11-15); its src/config_utils.h reads swmm_coupling_nodes
SWMM_git_URL: 'https://github.com/USEPA/Stormwater-Management-Model.git'
SWMM_tag_key: 'v5.2.4' 
SWMM_model: '${DATA_DIR}/external/hague_model.inp'  # one runnable SWMM model; the toolkit derives the coupled, hydrology and standalone models from it
swmm_outfalls_to_couple: []  # free, normal or fixed outfalls to turn into nodes that exchange water with the TRITON surface; Norfolk's two coupled outfalls, E143250 and E147007, are named by the water-level record of the external-boundary layer in the analysis config
subcatchment_raingage_mapping: '${DATA_DIR}/external/b_sub_ids_and_mrms_rain_col.csv'
subcatchment_raingage_mapping_gage_id_colname: 'raingage_id'
# ATTRIBUTE NAMES
landuse_lookup_class_id_colname: 'CLASS_ID'
landuse_lookup_mannings_colname: 'mannings'
# TOGGLES
toggle_use_swmm_for_hydrology: True
toggle_use_constant_mannings: False
toggle_triton_model: False
toggle_tritonswmm_model: True
toggle_swmm_model: False
# CONSTANTS
dem_outside_watershed_height: 9999 # meters
dem_building_height: 80 # meters
# PARAMETERS
target_dem_resolution: 3.5 # meters

