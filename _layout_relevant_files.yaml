  - path: src/hhemt/version_migration/versions/V0022__promote_producer_written_experiment_tree.py
    justification: >-
      M19 item 4b -- V0022's DIRECTION decision moves from positional to decidable. The
      module previously promoted whatever sat at the retired store name, argued from the fact
      that V0021.upgrade CONSUMES that path, so anything found there must post-date it. That
      theorem is sound for a tree that ran V0021 and then re-consolidated and UNSOUND for a
      tree that reached both names by producer evolution -- and such a tree was measured, its
      retired-name store carrying sa_*-keyed groups produced eight days BEFORE the
      member_*-keyed store at the unified name. The positional rule would have moved the newer
      member_* store aside and promoted the older sa_* one, a silent V0019 vocabulary
      regression that the retention design makes reversible but does not prevent.
      FOR (non-breaking), answering the question check-b asks. NOTHING a reader of an existing
      on-disk tree observes differs. No path, directory, filename, zarr group, dtype, chunk,
      encoding or root-attr KEY is added, renamed or removed; no _version.json field changes;
      no _status flag token changes; both ctx.move_dir calls are byte-identical and in the same
      order. The change is one refusal arm ahead of them, one advisory logger.warning, and
      three module-level readers. A LAYOUT_VERSION bump to 23 would be actively wrong: a V0023
      would have nothing to transform -- no old-shaped artifact to rename, no field to
      backfill -- which is the position this repo took at
      2026-06-27_v0016 migration body is a no-op not a backfill.
      AGAINST, stated rather than elided because it is the real objection and it is a
      DISCIPLINE objection rather than a layout one. A migration module is normally immutable
      once shipped: two trees both stamped 22 could otherwise have had different
      transformations applied, which is the invariant Alembic and Django both protect by
      requiring a NEW revision instead of an edit. Two things answer it here. (1) MEASURED:
      V0022 has never run. Across all 44 stamped trees in the local synthetic cache,
      migration_history is empty in 44 of 44 -- every tree reached layout 22 through the
      stamp_new_target forward-relabel defect (M19 item 1), never through the runner. So there
      is no tree whose applied-V0022 differs from this one. I cannot speak for a production
      tree outside that cache, and that residual is real. (2) The direction of the change is
      toward refusing: post-edit V0022 refuses in a case where it previously acted, and it
      never acts where it previously refused. A tree that already ran the old V0022 correctly
      would run the new one to the same outcome; only the demoting case diverges, and that
      case is the defect.
      WHAT THE NEW ARM KEYS ON, because it is not the obvious thing. It does NOT order the two
      stores by their producing commit count. A git describe count is a distance from the
      NEAREST REACHABLE TAG, so it is incommensurable across tag bases and non-monotone across
      divergent branches on one base -- measured on this repository at 8f47c8fb, 82 of 542
      v0.1.0-based commits sit in a chronological adjacency where the later commit carries the
      lower count, and two first-parent mainline commits 34 minutes apart carry
      pre-public-cut+92 then 0.1.0+89. Ordering on that would have introduced a FALSE REFUSAL
      whose message instructed an operator to delete a store by hand, outside the retention
      guarantee this module's design rests on. The arm instead keys on the member-group
      vocabulary (sa_ at the retired name against member_ at the unified name), which is a
      total function of the two stores, needs no git and no ancestry, and is decidable on a
      bundle or an archived tree. The commit count is retained as an advisory logger.warning
      and is never a refusal trigger.
      CHANGE-SCOPED via layout_signature. This path carries no prior row, so nothing is
      inherited and the signature below is its first.
    layout_signature: "a9b4afc68774a88122e54b7bb05c76d7eb9042609840821e99105ddf1c56cef1"
  - path: src/hhemt/processing_analysis.py
    justification: >-
      M19 du-member-scope-derivation S1 -- consolidate_to_datatree's tail rollup DERIVES its
      scope argument via du_sentinels._infer_scope(analysis_dir, analysis_dir) instead of
      passing the literal "analysis". This SUPERSEDES the 05a68430 row above on this same
      path.
      FOR (non-breaking), established by command rather than asserted. (1) NO SCHEMA CHANGE:
      the _du.json payload keeps the same keys and types at the same path; only the value of
      the `scope` string changes, and only on a MEMBER root, whose parent dir is `members`.
      (2) NO TRANSFORM IS REQUIRED FOR AN EXISTING TREE: an old member sentinel labelled
      "analysis" is read by the new code without error, and write_du_sentinel's
      compare-and-write handles a changed scope by rewriting rather than by failing -- so
      there is no state a migration would have to convert, which is the question the layout
      machinery asks. (3) NO FUNCTIONAL CONSUMER: the only readers of the `scope` field are
      du_sentinels.py:203's compare-and-write guard, V0019__member_vocabulary.py:176-177, and
      tests/test_synth_du_sentinel_integrity.py; sum_child_sentinels reads only
      disk_utilization_bytes and walk_errors from a child, never its scope.
      THE ONE BEHAVIOURAL EDGE, stated rather than omitted. sum_child_sentinels adds
      _EPHEMERAL_TOP_LEVEL_DIRS = {"_test"} to its skip set only when scope == "analysis"
      (du_sentinels.py:304-305), so a member root flipped to "member" would count its own
      _test/ bytes. Measured: ZERO _test directories exist anywhere under the synth cache,
      and _test is created only as `analysis_paths.analysis_dir / "_test"` by analysis.test()
      (analysis.py:2478, :2958, :3057), which builds representatives UNDER _test/ and never
      gives a member its own. The edge is unreachable on every tree that exists; that it is
      also arguably undesirable if it became reachable is filed as a separate follow-up
      against du_sentinels.py:304-305 and is NOT addressed here.
      CHANGE-SCOPED via layout_signature, set to the post-apply sha256 so the next change to
      this file re-fires the check.
    layout_signature: "3ec33b3393b39f6fa2298a9761b4ac30f31fbc16de69106fe161ed7e5b04378f"
  - path: src/hhemt/process_simulation.py
    justification: >-
      hydrology-capture decline -- TWO edits ship together in this file because the second
      calls the first. (1) A new _declared_nonzero_subcatchments staticmethod that READS the
      hydrology .inp and counts [SUBCATCHMENTS] rows with nonzero Area; it writes nothing and
      touches no on-disk artifact. (2) The standalone_rpt arm now writes
      hydrology_rpt_summary.zarr only when its subcatchment row count equals that declared
      count, and omits the capture otherwise so _capture_landed declines the delete through
      its existing contract; the same edit routes a report that does not PARSE to that same
      decline, instead of letting the pre-existing unguarded parse fail rule
