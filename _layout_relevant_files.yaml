      for `consolidation_build_stamp` and for `datatree_consolidation_complete`. No key is
      added, removed or renamed; the stamped value stays a sha1 hexdigest under the same key;
      no path, directory name, filename, zarr group, dtype, chunk, encoding or root-attr key
      moves; no _status flag token changes. The store's WRITE path is byte-unchanged -- this
      edit alters only WHEN a rebuild is triggered, never WHAT is written. The full diff of
      this file is +14/-0 with exactly five executable lines: one import and the four-line
      payload term.
