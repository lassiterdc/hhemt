      REBUILD ON EVERY EXISTING ANALYSIS: every stored fingerprint was computed over the
      three-term payload and cannot equal a four-term recomputation, so the next consolidation
      rebuilds once instead of reusing. It is content-idempotent -- the rebuild runs the
      unchanged write path and produces the same tree, with volatile provenance values
