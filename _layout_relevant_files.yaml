      ended on" line and produces exactly that. Every path changes WHEN an artifact is
      written, never its shape: the zarr's schema, path and attrs are untouched, and an
      omitted capture is the same on-disk state as a scenario whose reclaim never ran. No
      LAYOUT_VERSION bump, no V-module, no golden fixtures.
