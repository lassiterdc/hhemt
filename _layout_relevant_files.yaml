      or the report while every Snakemake rule reported green. On a REMOVAL the failure
      inverts and the store retains a scenario the user deleted. A count would not close it:
      remove one and add one and the count is identical, which is why the term is the SET.
      NON-BREAKING, AND MEASURED RATHER THAN ASSERTED. What could change on-disk meaning was
      compared BEFORE and AFTER by the coordinator: the persisted log KEY census is identical
      at HEAD and in the working tree for `consolidation_inputs_fingerprint` (7 occurrences in
