          renames, reshapes, adds-a-field-with-a-default, regenerates a derived file,
          or removes. NONE creates a data artifact from nothing, so "a file that used
          to be deleted now survives" is not a class this machinery can express.
      (3) Consumers enumerated rather than assumed. scenario.py
          _assert_scenario_forcing_window_agreement is permissively gated -- absence
          causes it to SKIP and is never read as a signal. analysis_validation.py
