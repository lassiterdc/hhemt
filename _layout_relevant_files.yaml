# Sentinel list for scripts/check_layout_version.py check-b.
# A change to any path/glob below WITHOUT a LAYOUT_VERSION bump fails CI.
# Add a path to non_breaking_allowlist (with a justifying commit message)
# when the change touches a layout-relevant module but does not break on-disk state.
layout_relevant:
  paths:
    - src/hhemt/paths.py
    - src/hhemt/scenario.py
    - src/hhemt/log.py
    - src/hhemt/scenario_inputs.py
    - src/hhemt/process_simulation.py
    - src/hhemt/processing_analysis.py
    - src/hhemt/cf_conventions.py
    - src/hhemt/sensitivity_analysis.py
    - src/hhemt/report_plot_ids.py  # reporting-system_canonical-plot-id (ADR-2): the canonical plot-ID grammar + per-renderer extension map. Figure stems ARE the plot IDs; a change here changes on-disk figure filenames (C-LAYOUT) and must bump LAYOUT_VERSION + ship a V{NNNN} migration. workflow.py consumes this module but is intentionally NOT layout-relevant (highest-churn file; would flood Check-B with false positives).
  globs:
    - "src/hhemt/config/**/*.py"
    - "src/hhemt/version_migration/schema/*.json"
    - "src/hhemt/version_migration/versions/*.py"
non_breaking_allowlist:
  - path: src/hhemt/process_simulation.py
    justification: >-
      cleanup-rerun-delete-redesign Phase 3 — replaces structurally broken
      _clear_raw_TRITON_outputs + _clear_raw_SWMM_outputs with a single corrected
      _clear_raw_outputs(model_type). Behavior change; existing on-disk analyses
      continue to work post-upgrade. SIGNATURE-SCOPED as of the ledger-driven
      resume-reset change: this entry was previously path-keyed with no
      layout_signature, which made the exemption PERMANENT — every later edit to this
      file passed Check B silently, including numeric-correctness edits to the
      per-scenario perf zarrs. Re-stamp layout_signature whenever a genuinely
      non-breaking change lands; a breaking one must bump LAYOUT_VERSION instead.
    layout_signature: "e76709d8fdce45397bd3d0e9ed7d9328f4fb84eea5719d3f5adbae34563b4a72"
  - path: src/hhemt/scenario.py
    justification: >-
      Two collapsed non-breaking changes. cleanup-rerun-delete-redesign Phase 3 —
      incidental method-signature touch to remove clear_raw_outputs references. AND
      resume-validity-and-cross-experiment-intercomparison Phase 3 — retire the
      vestigial log_run_triton / log_run_tritonswmm / log_run_swmm ScenarioPaths
      constructions. Provably non-breaking: nothing has ever WRITTEN those paths (full
      use-set was paths.py decl + scenario.py construction + 3 test assert-not-None +
      2 workflow.py comments), ScenarioPaths is a runtime dataclass that is never
      serialized, and no Snakemake rule, log JSON, zarr, fingerprint, or _version.json
      references them. No path or layout changes.
  - path: src/hhemt/paths.py
    justification: >-
      resume-validity-and-cross-experiment-intercomparison Phase 3 — retire the
      vestigial log_run_triton / log_run_tritonswmm / log_run_swmm ScenarioPaths field
      DECLARATIONS. Provably non-breaking: the fields are Optional[Path] = None on a
      runtime-only dataclass that is never serialized to disk, and nothing has ever
      written the paths they declared. Retired (rather than left unused) because they
      were load-bearing in the wrong direction: check_coupled_resume_validity
      hand-inlined the identical path and passed vacuously on every experiment for it.
      No on-disk artifact, filename, zarr group, log field, or _version.json changes.
  - path: src/hhemt/log.py
    justification: >-
      model-defect-registry commit 2 — retires the two DERIVED per-defect LogFields
      (triton_has_coupled_resume_fix, triton_has_swmm_depth_scatter_fix). triton_head_sha is
      RETAINED; only the two booleans go. Same change class as this file's existing allowlisted
      removal of the 7 persisted all_* rollup LogFields. Verified rather than asserted:
      TRITONSWMM_system_log sets no `extra` policy (model_config at log.py:199 carries only
      arbitrary_types_allowed), so pydantic's default `ignore` absorbs the retired keys, and a
      legacy system_log.json carrying both retired keys plus an unknown key loads cleanly
      through from_json — the production path — with triton_head_sha intact. No on-disk
      filename, zarr group, or _version.json change.
  - path: src/hhemt/processing_analysis.py
    justification: >-
      model-defect-registry commit 2 — _stamp_triton_provenance stops stamping the two derived
      booleans onto the consolidated-tree root. triton_producing_sha is RETAINED (it is the
      registry's input and the CP-5 per-arm solver column). The retired attrs were PLAIN root
      attrs deliberately kept out of metadata._EMBEDDED_PROV_KEYS, so they never entered the
      Gotcha-63 byte-identity golden fixtures and their removal cannot churn them. An old tree
      carrying them still classifies correctly, because applicability is now derived from the
      sha; a new tree read by an old toolkit shows them absent, which that toolkit already
      treats as INDETERMINATE rather than as a false warn.
  - path: src/hhemt/processing_analysis.py
    justification: >-
      reprocess-regeneration-toggle Phase 2 R4 — behavior-only early-return re-key
      (.exists() to .exists() AND datatree_consolidation_complete). The log field
      already exists and is set on success; no on-disk layout change.
  - path: src/hhemt/sensitivity_analysis.py
