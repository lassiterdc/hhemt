      `_unrun = [m for m in self._run.model_types_enabled
                 if not self._scenario.model_run_completed(m)]`
      and, when non-empty, drops "prep_inputs" from the reclaim classes. Net effect
      is strictly FEWER deletions: dats/ and extbc/ survive when a model has not run.
      WHY NON-BREAKING, by measurement rather than by the direction of the change
      (the "more files retained must be safe" argument is UNSOUND in general, because
      absence is observable, and it is not the argument relied on here):
      (1) `grep -rn "dats\|extbc" src/hhemt/version_migration/ tests/fixtures/legacy_layouts/`
