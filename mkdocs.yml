site_name: "H&H Ensemble Modeling Toolkit"
site_description: "Orchestrates coupled TRITON (2D hydrodynamic) and SWMM (stormwater management) simulations across local machines and HPC clusters"
site_author: "Daniel Lassiter"
repo_url: "https://github.com/lassiterdc/hhemt"
# `stable` (the default published build) tracks the latest tag on `main`, so an
# "edit this page" link must resolve against `main` rather than `develop`.
# Pointing it at `develop` sent every released-docs reader to unreleased content.
edit_uri: "edit/main/docs/"

theme:
  name: material
  features:
    # NAVIGATION LIVES IN THE SIDEBAR AND NOWHERE ELSE. Three flags are absent
    # deliberately and each absence answers a specific reader complaint; a
    # future editor restoring any of them should read this block first.
    #
    # `navigation.tabs` — ABSENT. It renders the top-level sections as header
    #   tabs, which made the home page a list of links that were already on
    #   screen. With it gone the sections render in the sidebar, and the home
    #   page is free to be a landing page rather than a second nav bar.
    # `navigation.sections` — ABSENT. It renders top-level sections as flat
    #   always-expanded groups. The API reference is long enough that a
    #   non-collapsible sidebar stops working as navigation, so sections must
    #   be expandable nodes instead.
    # `toc.integrate` — ABSENT. It merges each page's own table of contents
    #   into the LEFT sidebar, so on a long page the per-page headings and the
    #   site nav compete in one column. The TOC belongs on the right.
    #
    # `navigation.indexes` is PRESENT and is the structural fix for two pages
    # sharing one name: it attaches a section's `index.md` to the section NODE,
    # so "How-To Guides" in the sidebar opens the index instead of expanding to
    # reveal a child also called "How-To Guides". It requires each section's
    # first nav entry to be a bare `{section}/index.md`, which this nav already
    # satisfies for all four sections.
    - navigation.indexes
    - navigation.top
  palette:
    # Dark is the DEFAULT, deliberately, and the ordering is what makes it so:
    # Material uses the first entry unless a `media` query redirects it, so no
    # `media` key appears here — an OS-preference query would hand light-mode
    # readers the light palette on first visit, which is not "default to dark".
    # Both entries are required: a one-entry palette renders with no toggle at all.
    - scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - htmlproofer:
      validate_external_urls: false
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            filters: ["!^_"]

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

exclude_docs: |
  running a simulation.ipynb
  processing_sim_outputs.ipynb

nav:
  - Home: index.md
  - Tutorials:
      - tutorials/index.md
      - Quickstart: tutorials/quickstart.md
      - Norfolk end-to-end: tutorials/norfolk-end-to-end.md
  - How-To Guides:
      - how-to/index.md
      - Installation: how-to/installation.md
      - HPC-profile setup: how-to/hpc-profile-setup.md
      - Config filling: how-to/config-filling.md
      - Running an experiment bundle: how-to/running-an-experiment-bundle.md
      - In-flight operations: how-to/in-flight-operations.md
      - Diagnosing a failed run: how-to/diagnosing-a-failed-run.md
      - Forcing re-runs: how-to/forcing-reruns.md
      - Combining experiments: how-to/combining-experiments.md
      - Synthetic compute-sensitivity experiment: how-to/synthetic-compute-sensitivity-experiment.md
      - Publishing and fetching: how-to/publishing.md
      - Reprex round-trip: how-to/reprex-roundtrip.md
      - DOI round-trip (operator): how-to/doi-roundtrip-e2e.md
  - Reference:
      - reference/index.md
      - API Reference: reference/api.md
      - Configuration schema: reference/config-schema.md
      - CLI reference: reference/cli.md
      - Output data model: reference/output-data-model.md
      - FAIR scope table: reference/fair-scope-table.md
      - The interactive analysis report: reference/example-report.md
  - Explanation:
      - explanation/index.md
      - Capabilities: explanation/capabilities.md
      - Limitations and constraints: explanation/limitations.md
      - Software availability: explanation/software-availability.md
      - Rerun FAQ: explanation/rerun-faq.md
      - Branching and release model: explanation/branching-and-release-model.md
