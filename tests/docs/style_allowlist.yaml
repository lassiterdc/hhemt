# Allowlist of the docs style test (tests/docs/test_docs_style.py).
# One entry per block. An entry matches every identical line of its page and rule.
# status: baseline = present when the rule was added; permitted = a reviewer concurred with the exception.
# A permitted entry holds the exact line (`line`). A baseline entry holds `line_sha1`, the SHA-1 hex digest of the exact
# line in UTF-8, so this file does not republish page text; run the rule over the page to read the line behind a digest.
entries:
  - page: "docs/reference/api-analysis.md"
    rule: "which"
    line: "which"
    surface: "api-docstring"
    status: permitted
    reason: "Rule which: the line declares the numpydoc parameter named `which`, a public argument; renaming the parameter changes executable code and the public API, and a docstring edit changes neither."
  - page: "docs/reference/api-analysis.md"
    rule: "which"
    line: "which : Literal[\"TRITON\", \"SWMM\", \"both\"]"
    surface: "api-docstring"
    status: permitted
    reason: "Rule which: the line declares the numpydoc parameter named `which`, a public argument (analysis.py:1078 print_cfg, analysis.py:1998, analysis.py:2288, sensitivity_analysis.py:491); renaming the parameter changes executable code and the public API, and a docstring edit changes neither."
  - page: "docs/reference/api-analysis.md"
    rule: "which"
    line: "which : Literal[\"TRITON\", \"SWMM\", \"both\"], optional"
    surface: "api-docstring"
    status: permitted
    reason: "Rule which: the line declares the numpydoc parameter named `which`, a public argument (analysis.py:1078 print_cfg, analysis.py:1998, analysis.py:2288, sensitivity_analysis.py:491); renaming the parameter changes executable code and the public API, and a docstring edit changes neither."
  - page: "docs/reference/api-analysis.md"
    rule: "which"
    line: "which : Literal[\"system\", \"analysis\", \"both\"], optional"
    surface: "api-docstring"
    status: permitted
    reason: "Rule which: the line declares the numpydoc parameter named `which`, a public argument (analysis.py:1078 print_cfg, analysis.py:1998, analysis.py:2288, sensitivity_analysis.py:491); renaming the parameter changes executable code and the public API, and a docstring edit changes neither."
  - page: "docs/reference/api-analysis.md"
    rule: "which"
    line: "which : {\"TRITON\", \"SWMM\", \"both\"}"
    surface: "api-docstring"
    status: permitted
    reason: "Rule which: the line declares the numpydoc parameter named `which`, a public argument (analysis.py:1078 print_cfg, analysis.py:1998, analysis.py:2288, sensitivity_analysis.py:491); renaming the parameter changes executable code and the public API, and a docstring edit changes neither."
  - page: "docs/contributing.md"
