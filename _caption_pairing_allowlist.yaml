# An entry exempts ONE (renderer, caption) PAIR from the caption-pairing
# requirement, for the EXACT renderer content recorded in renderer_sha256.
#
# Keyed by the PAIR, not by the renderer: a module-keyed exemption would let one
# justification cover every caption that module owns -- six, for
# eda_compute_sensitivity -- which is a blanket rather than an exemption. One
# justification covers one re-read. The verbosity is deliberate: it makes "one
# sentence covers six documents" unwriteable.
#
# The digest makes the exemption EXPIRE. Change the renderer again and it stops
# matching, so the guard fires and someone re-reads the caption. Compare
# _layout_relevant_files.yaml's non_breaking_allowlist, whose scenario.py entry
# has already accreted "Two collapsed non-breaking changes" because a path-keyed
# exemption never expires -- the permanent-hole outcome, already realised in the
# sibling machinery this guard is modelled on.
unpaired_allowlist:
  - renderer: sensitivity_benchmarking
    caption: src/hhemt/report_templates/captions/sensitivity_benchmarking.rst
    renderer_sha256: 9af752907fa02320901e1e849a3fbeed61a94eefc7927bdf6686c3c7d87d30e1
    justification: >-
      Iteration-8 caption-geometry group (D1.2 width declaration, D1.3
      content_width_px adoption, R5.6 literal-subtraction retirement), plus a
      whole-file ruff-format pass. Caption re-read: it describes the dependent
      variable, aggregation mode, SWMM-only routing and the wallclock-reduction
      stipulation, and makes no structural claim about panels, columns or
      caption geometry, so none of those changes falsifies it. Looked; no
      change needed.
  - renderer: cross_experiment_intercomparison_maps
    caption: src/hhemt/report_templates/captions/cross_experiment_intercomparison_maps.rst
    renderer_sha256: f03f918dfef6119ca7d7217ace2b82b1dcb2258bc221f3598a07d263e7af2ba2
    justification: >-
      Iteration-8 annotation-carrier group (D3 annotation split and the
      title-collision fix), plus a whole-file ruff-format pass. Caption re-read:
      it describes diff-map semantics (resume minus clean over byte-identity
      classes), the RdBu direction convention, and the variable-dt SWMM
      final-period truncation. All three are data claims; the change moved
      annotation anchoring only. Looked; no change needed. NOTE: the
      cross-experiment RESTRUCTURE is still open on a user question, so this
      exemption expires with the next renderer change by construction.
