# requirement, for the EXACT renderer content recorded in renderer_sha256.
#
# Keyed by the PAIR, not by the renderer: a module-keyed exemption would let one
# justification cover every caption that module owns -- six, for
# eda_compute_sensitivity -- which is a blanket rather than an exemption. One
# justification covers one re-read. The verbosity is deliberate: it makes "one
# sentence covers six documents" unwriteable.
#
# The digest makes the exemption EXPIRE. Change the renderer again and it stops
# matching, so the guard fires and someone re-reads the caption. Compare
# _layout_relevant_files.yaml's non_breaking_allowlist, whose scenario.py entry
# has already accreted "Two collapsed non-breaking changes" because a path-keyed
# exemption never expires -- the permanent-hole outcome, already realised in the
# sibling machinery this guard is modelled on.
#
# KNOWN-STALE EXEMPTION, DISCLOSED RATHER THAN RE-RECORDED (2026-09-01)
#
# `sensitivity_benchmarking` below carries a digest that no longer matches its
# renderer. The renderer was changed by the docs-and-experiment-system merge
# cleanup -- an E402 import hoist plus a whole-tree ruff-format pass -- and the
# recorded digest predates both.
#
# It is NOT re-recorded, deliberately. Re-recording would stamp a fresh "someone
# looked" claim onto a caption nobody re-read, which is the false artifact this
# file's own header warns about one paragraph up. A disclosed stale exemption is
# honest; a silently refreshed one is not.
#
# WHY THE GUARD DOES NOT REPORT IT. main() skips a pair before consulting the
# allowlist at all: `if renderer_rel not in changed or caption_rel in changed:
# continue`. Both disjuncts have fired here at different moments -- at merge time
# the merge had also edited the caption, and post-merge the renderer is simply no
# longer in the diff against the base ref. Either way the stale-digest branch is
# unreachable, so the guard is silent about it.
#
# WHEN IT WILL FIRE. The first commit that changes
# `src/hhemt/report_renderers/sensitivity_benchmarking.py` WITHOUT also touching
# `src/hhemt/report_templates/captions/sensitivity_benchmarking.rst`. At that point
# the pair reaches the allowlist, the digest mismatches, and the guard emits a
# stale-exemption message citing a digest from before this merge. That is the
# guard working. The correct response then is to re-read the caption and either
# edit it or re-record the digest with a fresh justification -- not to assume the
# staleness is this note's leftover.
#
# DISCHARGED 2026-09-04. It fired exactly as predicted -- on a commit that changes the
# renderer (FR-7, an error-path-only diagnostic) and not the caption. The caption was
# re-read in full, the digest re-recorded, and the intervening merge-cleanup layer shown
# import/format-only by AST measurement. The paragraphs above are RETAINED rather than
# deleted: the prediction and its discharge are the evidence that this guard's expiry
# mechanism works, and that is worth more than a tidy file. Only the sentence "It is NOT
# re-recorded, deliberately" is now historical -- it describes the state until 2026-09-04.
#
